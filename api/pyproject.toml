[project]
name = "sentinel-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2,<3",
  "python-jose[cryptography]>=3.3,<4",
  "bcrypt>=4,<5",
  "pyotp>=2.9,<3",
  "httpx>=0.27,<1",
  "sqlalchemy>=2,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "structlog>=25,<26",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "respx>=0.21,<1",
]

[tool.pytest.ini_options]
# The API imports `sentinel_worker` from the sibling `worker/` package. Pin the
# co-located worker source onto sys.path so the suite always exercises THIS
# checkout — not a stale editable install that may point at a different
# worktree (the Conductor pip-editable caveat; see AUDIT.md §Reconciliation).
# Removes the need to pass PYTHONPATH=../worker by hand in local runs and CI.
pythonpath = ["../worker"]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
