# sentinel.yml

target:
  repo: https://github.com/your-org/your-repo  # GitHub repo to scan
  # domain: your-app.com                        # Optional: seed for attack surface; omit to infer from repo only

stages:
  attack_surface: true    # Passive subdomain/DNS/TLS/Shodan inventory (defender-facing)
  dependency_risk: true # npm + PyPI reachability / CVE / cadence / transitivity (see PRD)
  code_security: true   # LLM semantic security on PR/diff (auth, injection, secrets, SSRF-shaped, etc.)
  # auth_review: true     # Deprecated alias for code_security — prefer code_security

llm:
  provider: anthropic    # anthropic | openai
  model: claude-sonnet-4-20250514
  # code_security:
  #   categories: [access_control, injection, secrets, ssrf, deserialization, crypto_tls]

output:
  format: json           # json | html | markdown
  path: ./sentinel-report

scan:
  quiet: false           # When true, equivalent to `sentinel scan --quiet` (no Rich UI, no auto-dashboard)
  auto_dashboard: true   # After scan, start local dashboard bound to `output.path` (ignored when quiet)

dashboard:
  port: 4000             # Port for `sentinel dashboard` and post-scan auto-dashboard
  auto_open: true        # Open browser automatically when the dashboard starts

thresholds:
  dep_risk_score: 7.0              # Fail CI if any dep scores above this (0–10)
  code_security_severity: high   # Fail CI at this severity or above (code stage)
