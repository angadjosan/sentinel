[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-sec"
version = "0.1.0"
description = "AI-powered attack surface monitoring, dependency risk scoring, and auth flaw detection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Angad Josan" }]
keywords = ["security", "attack-surface", "dependency-scanning", "auth-review", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.28",
    "pydantic>=2.0",
    "anthropic>=0.40",
    "dnspython>=2.6",
    "tomllib; python_version < '3.11'",
    "pyyaml>=6.0",
    "fastapi>=0.135",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.3",
    "redbeat>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx",  # for test client
]

[project.scripts]
sentinel = "sentinel.cli.main:cli"

[project.urls]
Homepage = "https://github.com/angadjosan/sentinel"
Repository = "https://github.com/angadjosan/sentinel"
Issues = "https://github.com/angadjosan/sentinel/issues"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
