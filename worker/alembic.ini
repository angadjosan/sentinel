# Alembic configuration for Sentinel worker
# Override the sqlalchemy.url via the ALEMBIC_DB_URL environment variable

[alembic]
script_location = alembic

# Override via ALEMBIC_DB_URL env var
sqlalchemy.url = postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
