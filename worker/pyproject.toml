[project]
name = "sentinel-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "sqlalchemy>=2,<3",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "structlog>=25,<26",
  "cryptography>=44,<45",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
sentinel-worker = "sentinel_worker.worker_main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
