[project]
name = "sentinel-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "sqlalchemy>=2,<3",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "structlog>=25,<26",
  "cryptography>=44,<45",
  "packaging>=24,<26",
  "anthropic>=0.76,<1",
  "openai>=2,<3",
  "alembic>=1.14,<2",
  "tree-sitter>=0.21,<1",
  "tree-sitter-python>=0.21,<1",
  "tree-sitter-javascript>=0.21,<1",
  "tree-sitter-typescript>=0.21,<1",
]

[project.optional-dependencies]
grammars = [
  "tree-sitter-go>=0.21,<1",
  "tree-sitter-rust>=0.21,<1",
  "tree-sitter-java>=0.21,<1",
  "tree-sitter-c>=0.21,<1",
  "tree-sitter-cpp>=0.21,<1",
  "tree-sitter-ruby>=0.21,<1",
]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "hypothesis>=6,<7",
]

[project.scripts]
sentinel-worker = "sentinel_worker.worker_main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Put the worker root on sys.path so `from tests.conftest import ...` resolves
# regardless of how pytest is invoked (bare `pytest` vs `python -m pytest`).
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
