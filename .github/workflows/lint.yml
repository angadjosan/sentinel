name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Pinned: an unpinned linter turns an upstream release into a red build
      # on code nobody touched. Bump deliberately, with the fixes in the same PR.
      - run: pip install "ruff==0.16.5" "mypy==1.18.2" -e "./api[test]" -e "./worker[test]"
      - run: ruff check api/sentinel_api worker/sentinel_worker
      - run: mypy api/sentinel_api worker/sentinel_worker --ignore-missing-imports

  typescript:
    name: TypeScript (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
