name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff mypy -e ./api -e ./worker
      - run: ruff check api/src worker/src
      - run: mypy api/src worker/src --ignore-missing-imports

  typescript:
    name: TypeScript (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
