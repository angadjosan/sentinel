name: Sentinel (surface + deps + LLM security)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"  # nightly at 3am UTC

jobs:
  sentinel:
    name: Sentinel scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sentinel
        run: pip install sentinel-sec

      - name: Run Sentinel scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Full pipeline: defender surface inventory, npm/PyPI exploitability, semantic PR security (LLM).
          sentinel scan \
            --repo ${{ github.server_url }}/${{ github.repository }} \
            --domain ${{ vars.SENTINEL_DOMAIN }} \
            --format sarif \
            --output sentinel-results \
            --fail-on high \
            --quiet

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sentinel-results/findings.sarif

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-findings
          path: sentinel-results/
