services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_JWT_SECRET: dev-secret
      SENTINEL_DEV_MODE: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["sentinel-worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_WORKER_ID: local-worker
      SENTINEL_WORKER_POLL_INTERVAL: "1"
    depends_on:
      postgres:
        condition: service_healthy
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      NEXT_PUBLIC_SENTINEL_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
