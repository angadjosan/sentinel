services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ${SENTINEL_IMAGE_API:-ghcr.io/your-org/sentinel/api:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}
      SENTINEL_JWT_SECRET: ${SENTINEL_JWT_SECRET:?SENTINEL_JWT_SECRET is required}
      SENTINEL_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    # Staging (default): the API image is fine — no sandbox tooling needed.
    # For local_worker pentest, use the sandbox-capable worker image instead:
    #   image: ${SENTINEL_IMAGE_WORKER:-ghcr.io/your-org/sentinel/worker:latest}
    image: ${SENTINEL_IMAGE_API:-ghcr.io/your-org/sentinel/api:latest}
    command: ["sentinel-worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}
      SENTINEL_WORKER_ID: ${HOSTNAME:-worker-1}
      SENTINEL_WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2}
      # --- local_worker gVisor sandbox (opt-in) ---------------------------------
      # SENTINEL_EMBEDDED_DOCKER: "1"      # run an embedded dockerd+runsc (needs privileged)
      # SENTINEL_SANDBOX_RUNTIME: "auto"   # auto | gvisor | runc
      # SENTINEL_SANDBOX_HARD_EGRESS: "1"  # apply iptables egress DROP (needs NET_ADMIN)
      # SENTINEL_BROKER_<REF>: "<secret>"  # real upstream creds for the credential broker
    # To enable the sandbox, pick ONE shape and uncomment it:
    #   (a) embedded daemon — self-contained, runs anywhere privileged is allowed:
    # privileged: true
    #   (b) host daemon — the host runs dockerd+runsc (see scripts/install-gvisor.sh):
    # cap_add: ["NET_ADMIN"]
    # volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    image: ${SENTINEL_IMAGE_DASHBOARD:-ghcr.io/your-org/sentinel/dashboard:latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SENTINEL_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      SENTINEL_API_INTERNAL_URL: http://api:8000
      SENTINEL_JWT_SECRET: ${SENTINEL_JWT_SECRET:?SENTINEL_JWT_SECRET is required}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
