services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ${SENTINEL_IMAGE_API:-ghcr.io/your-org/sentinel/api:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinel}
      SENTINEL_JWT_SECRET: ${SENTINEL_JWT_SECRET:?SENTINEL_JWT_SECRET is required}
      SENTINEL_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dashboard:
    image: ${SENTINEL_IMAGE_DASHBOARD:-ghcr.io/your-org/sentinel/dashboard:latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SENTINEL_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      SENTINEL_API_INTERNAL_URL: http://api:8000
      SENTINEL_JWT_SECRET: ${SENTINEL_JWT_SECRET:?SENTINEL_JWT_SECRET is required}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
